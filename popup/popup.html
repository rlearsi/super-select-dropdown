<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Select & Dark Mode</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="popup-container">
        <!-- Header -->
        <header class="header">
            <div class="brand">
                <div class="logo-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect width="18" height="18" x="3" y="3" rx="4"></rect>
                        <path d="m8 10 4 4 4-4"></path>
                    </svg>
                </div>
                <div>
                    <h1 class="title">Super Select</h1>
                    <span class="subtitle" id="site-host">Detectando site...</span>
                </div>
            </div>
            <div class="badge-status" id="active-badge">Ativo</div>
        </header>

        <!-- Main Cards -->
        <div class="card">
            <div class="card-row">
                <div class="card-info">
                    <div class="card-icon moon-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
                        </svg>
                    </div>
                    <div>
                        <div class="card-title">Modo Escuro</div>
                        <div class="card-desc" id="theme-desc">Alternar visual do site</div>
                    </div>
                </div>
                <label class="switch" title="Ativar/Desativar modo escuro">
                    <input type="checkbox" id="theme-toggle">
                    <span class="slider"></span>
                </label>
            </div>
        </div>

        <!-- Select Status Card -->
        <div class="card card-compact">
            <div class="card-row">
                <div class="card-info">
                    <div class="card-icon select-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="4" x2="20" y1="6" y2="6"></line>
                            <line x1="4" x2="14" y1="12" y2="12"></line>
                            <line x1="4" x2="18" y1="18" y2="18"></line>
                        </svg>
                    </div>
                    <div>
                        <div class="card-title">Selects na Página</div>
                        <div class="card-desc"><span id="select-count" class="highlight">0</span> transformados</div>
                    </div>
                </div>
                <button type="button" class="btn-action" id="btn-retransform" title="Reescanear selects">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"></path>
                        <path d="M21 3v5h-5"></path>
                        <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"></path>
                        <path d="M8 16H3v5"></path>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Footer -->
        <footer class="footer">
            <span>Adaptive Select Extension</span>
            <span class="version">v1.0</span>
        </footer>
    </div>

    <script src="popup.js"></script>
</body>
</html>
