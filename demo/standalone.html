<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adaptive Select Demo</title>

    <link rel="stylesheet" href="../adaptive-select.css?v=2">
    <script src="../adaptive-select.js?v=2" defer></script>

    <style>
        body {
            margin: 0;
            padding: 40px;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f5f5;
        }

        .demo {
            max-width: 600px;
            margin: auto;
            padding: 24px;
            background: white;
            border-radius: 14px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }

        .field {
            margin-bottom: 24px;
        }

        .field label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }
    </style>
</head>

<body>

    <div class="demo">

        <div class="field">
            <label>2 Options (Selectable Buttons)</label>

            <select>
                <option value="yes">Yes</option>
                <option value="no">No</option>
            </select>
        </div>

        <div class="field">
            <label>4 Options (Button Group)</label>

            <select>
                <option value="small">Small</option>
                <option value="medium">Medium</option>
                <option value="large">Large</option>
                <option value="extra">Extra Large</option>
            </select>
        </div>

        <div class="field">
            <label>6 Options (Modern Dropdown)</label>

            <select>
                <option>Brazil</option>
                <option>Argentina</option>
                <option>Chile</option>
                <option>Uruguay</option>
                <option>Paraguay</option>
                <option>Bolivia</option>
            </select>
        </div>

        <div class="field">
            <label>1 Option (Toggle Switch)</label>

            <select>
                <option value="enabled">Enable Feature</option>
            </select>
        </div>

    </div>

</body>

</html>
